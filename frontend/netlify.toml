[build]
  command = "npm run build"
  publish = "dist"

# Replace this placeholder with the deployed FastAPI backend origin.
# Netlify redirects do not expand environment variables inside `to`.
[[redirects]]
  from = "/api/*"
  to = "https://school-management-backend-m8n8.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
